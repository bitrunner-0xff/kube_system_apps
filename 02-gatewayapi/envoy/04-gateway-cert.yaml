apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-app-certificate
  namespace: demo-app
spec:
  secretName: demo-app-tls
  duration: 9125h # 1y
  renewBefore: 360h # 15d
  subject:
    organizations:
      - bitrunner lab
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 4096
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  dnsNames:
    - www.bitrunner.local
  issuerRef:
    name: dev-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
