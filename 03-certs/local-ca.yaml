apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-dev-ca
spec:
  ca:
    secretName: local-dev-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "Local Development CA"
  secretName: local-dev-ca
  duration: 87600h # 10y
  subject:
    organizations:
      - "bitrunner dev"
    organizationalUnits:
      - "Home lab"
    localities:
      - "Berlin"
    countries:
      - "DE"
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 4096
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
