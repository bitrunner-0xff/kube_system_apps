apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: gateway
spec:
  secretName: argocd-tls

  dnsNames:
    - argocd.bitrunner.home.arpa

  issuerRef:
    name: local-dev-ca
    kind: ClusterIssuer

  duration: 2160h # 90 days
  renewBefore: 360h # 15 days

  privateKey:
    rotationPolicy: Always
